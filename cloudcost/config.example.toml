# cloudcost init 生成本文件。所有相对路径以配置文件所在目录为准。
[monitor]
database = "cloudcost.sqlite3"
interval_seconds = 3600
stale_after_hours = 26

# 固定汇率：1 USD = 7.2 CNY，无外部汇率依赖。
[fx]
USD = "1"
CNY = "7.2"

[budget]
total = "1000"
currency = "USD"

[[providers]]
id = "aws"
kind = "aws"
mode = "native"
currency = "USD"
threshold = "500"
metric = "UnblendedCost"
# profile = "billing-readonly"  # 不配置时使用 boto3 默认凭据链

[[providers]]
id = "vercel"
kind = "vercel"
mode = "native"
currency = "USD"
threshold = "100"
token_env = "VERCEL_TOKEN"
team_id_env = "VERCEL_TEAM_ID"
# 也可使用 team_id = "team_..." 或 slug = "your-team"

[[providers]]
id = "cloudflare"
kind = "cloudflare"
mode = "native"
currency = "USD"
threshold = "100"
token_env = "CLOUDFLARE_API_TOKEN"
account_id_env = "CLOUDFLARE_ACCOUNT_ID"
# 官方受限接口仅返回按用量计费的费用，不含固定套餐。
# 不设置固定月费则显示覆盖不完整并暂停该平台/总预算报警。
# 核对所有固定套餐月费后设置；没有固定月费时显式填 "0"。
# fixed_monthly_cost = "5"  # 原币、整个自然月的固定费用估计，按月全额计入

[[providers]]
id = "aliyun"
kind = "aliyun"
mode = "native"
currency = "CNY"
threshold = "1000"
access_key_env = "ALIYUN_ACCESS_KEY_ID"
secret_key_env = "ALIYUN_ACCESS_KEY_SECRET"
# security_token_env = "ALIYUN_SECURITY_TOKEN"

[[providers]]
id = "alibabacloud"
kind = "alibabacloud"
mode = "native"
currency = "USD"
threshold = "200"
access_key_env = "ALIBABACLOUD_ACCESS_KEY_ID"
secret_key_env = "ALIBABACLOUD_ACCESS_KEY_SECRET"

[[channels]]
name = "terminal"
type = "console"


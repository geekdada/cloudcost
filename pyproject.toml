[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudcost-monitor"
version = "0.2.0"
description = "Monthly multi-cloud costs, SQLite, budget alerts and a local dashboard"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
test = ["playwright>=1.48,<2"]

[project.scripts]
cloudcost = "cloudcost.cli:main"

[tool.setuptools.package-data]
cloudcost = ["static/*", "config.example.toml"]

[tool.setuptools.packages.find]
include = ["cloudcost*"]
